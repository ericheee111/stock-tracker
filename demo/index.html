<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>私享股池 · 内部参考</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== 顶部：产品名 + 市场切换 ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 9l10 13 10-13L12 2z"/><path d="M2 9l10 4 10-4"/><path d="M12 13v9"/></svg></span>
      <div class="brand-text">
        <div class="brand-name">私享股池</div>
        <div class="brand-sub">个人 & 小圈子内部参考 · 免登录</div>
        <span class="demo-pill">模拟演示</span>
      </div>
    </div>
    <!-- 市场 Tab 切换：A股 / 港股 / 美股 -->
    <nav class="market-tabs" id="marketTabs">
      <button class="market-tab active" data-market="A">A股</button>
      <button class="market-tab" data-market="HK">港股</button>
      <button class="market-tab" data-market="US">美股</button>
    </nav>
  </header>

  <!-- ===== 主体：5 个页面 section，靠 JS 显隐 ===== -->
  <main class="content">

    <!-- ① 行情总览 -->
    <section class="page active" id="page-overview">
      <h2 class="page-title"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg> 行情总览</h2>

      <!-- 三大市场指数卡片 -->
      <div class="index-grid" id="indexGrid"></div>

      <!-- 涨跌家数分布条 -->
      <div class="card up-down-bar-card">
        <div class="card-title">今日涨跌家数</div>
        <div class="up-down-bar" id="upDownBar"></div>
        <div class="up-down-legend" id="upDownLegend"></div>
      </div>

      <!-- 今日异动卡片流 -->
      <div class="section-label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3.5 3.5 3.5 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg> 今日异动</div>
      <div class="mover-list" id="moverList"></div>
    </section>

    <!-- ② 自选股监控 -->
    <section class="page" id="page-watch">
      <h2 class="page-title"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> 自选股监控</h2>
      <!-- 今日触发信号摘要条 -->
      <div class="signal-summary" id="watchSummary"></div>
      <div id="watchGroups"></div>
    </section>

    <!-- ③ 买卖点信号 -->
    <section class="page" id="page-signal">
      <h2 class="page-title"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/><circle cx="12" cy="12" r="3"/></svg> 买卖点信号</h2>
      <div class="signal-list" id="signalList"></div>
    </section>

    <!-- ④ 个股推荐（小红书种草流） -->
    <section class="page" id="page-reco">
      <h2 class="page-title"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0018 8 6 6 0 00-6-6h0a6 6 0 00-6 6c0 1 .23 2.05 1.5 3.5.76.76 1.23 1.52 1.41 2.5"/></svg> 个股推荐</h2>
      <!-- 标签筛选栏 -->
      <div class="tag-filter" id="recoTagFilter"></div>
      <div class="reco-hint" id="recoHint"></div>
      <div class="reco-grid" id="recoGrid"></div>
    </section>

    <!-- ⑤ 市场筛选 -->
    <section class="page" id="page-filter">
      <h2 class="page-title"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> 市场筛选</h2>
      <div class="filter-bar card" id="filterBar"></div>
      <div class="filter-result" id="filterResult"></div>
    </section>

  </main>

  <footer class="disclaimer" id="disclaimer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;display:inline-block;margin-right:4px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>本页面为内部演示 Demo，行情、买卖点信号与个股推荐均来自<strong>模拟数据</strong>，仅供学习参考，<strong>不构成任何投资建议</strong>。市场有风险，决策需谨慎。</footer>

  <!-- ===== 底部：5 个 Tab 导航 ===== -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="overview"><span class="nav-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span><span>行情</span></button>
    <button class="nav-btn" data-page="watch"><span class="nav-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span><span>自选</span></button>
    <button class="nav-btn" data-page="signal"><span class="nav-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/><circle cx="12" cy="12" r="3"/></svg></span><span>信号</span></button>
    <button class="nav-btn" data-page="reco"><span class="nav-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0018 8 6 6 0 00-6-6h0a6 6 0 00-6 6c0 1 .23 2.05 1.5 3.5.76.76 1.23 1.52 1.41 2.5"/></svg></span><span>推荐</span></button>
    <button class="nav-btn" data-page="filter"><span class="nav-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span><span>筛选</span></button>
  </nav>

  <!-- ===== 信号详情弹层 ===== -->
  <div class="sheet-mask" id="sheetMask" hidden>
    <div class="sheet" id="sheet"></div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" hidden></div>

  <!-- 脚本：先数据后逻辑 -->
  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
