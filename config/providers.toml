# Provider 列表（按数组顺序作主备；supports_snapshot 决定 COLD 主源）
# 零依赖：仅用标准库 urllib。熔断/退避/限频见 core 与 data_quality/health.py

[[providers]]
name = "tencent"
cls = "TencentProvider"
markets = ["a", "hk", "us"]
primary = true
supports_snapshot = false
timeout_ms = 3000
max_rps = 5
backoff_base_sec = 1.0
backoff_max_sec = 60.0
circuit_fail_threshold = 5
host = ""
bars_fallback = true        # K 线兜底源：eastmoney 主源不可用/熔断时由其补齐（supports_bars 仍为 False）

[[providers]]
name = "eastmoney"
cls = "EastmoneyProvider"
markets = ["a", "hk", "us"]   # hk/us 仅用于 K 线(bars)路由；quote 主源仍是 tencent
primary = false
supports_snapshot = true
timeout_ms = 3000
max_rps = 3
backoff_base_sec = 1.0
backoff_max_sec = 60.0
circuit_fail_threshold = 5

[[providers]]
name = "sina"
cls = "SinaProvider"
markets = ["a"]
primary = false
supports_snapshot = false
timeout_ms = 3000
max_rps = 5
backoff_base_sec = 1.0
backoff_max_sec = 60.0
circuit_fail_threshold = 5

# Stage 3C：可选本地行情 Sidecar。默认关闭；仅允许 localhost、只读、RAW Bar。
# 启用前必须固定并填写实际 release 与本地数据/清单/二进制 SHA-256。
[[providers]]
name = "free_stockdb"
cls = "FreeStockDbProvider"
markets = ["a"]
enabled = false
primary = false
supports_snapshot = false
host = "127.0.0.1:7899"
timeout_ms = 3000
max_rps = 20
backoff_base_sec = 1.0
backoff_max_sec = 30.0
circuit_fail_threshold = 3
bars_fallback = false
bars_priority = 30
read_only = true
trust_tier = "T1_BEST_EFFORT"
allow_live_decision = false
allow_model_training = false
allow_public_redistribution = false
release_version = ""
binary_inventory_sha256 = ""
data_snapshot_manifest_sha256 = ""
sync_manifest_sha256 = ""

# 可选同花顺官方 REST 日线捕获源。默认关闭；凭据只从进程环境读取，
# 不写入 TOML、日志、公开 Runtime Config 或 Git。首期只允许 A 股日线原始
# 响应捕获，固定 T1/BEST_EFFORT，不进入 HOT/WARM/COLD 决策、训练或再分发。
[[providers]]
name = "hithink_finance"
cls = "HithinkFinanceProvider"
markets = ["a"]
enabled = false
primary = false
supports_snapshot = false
host = ""
timeout_ms = 8000
max_rps = 2
backoff_base_sec = 2.0
backoff_max_sec = 60.0
circuit_fail_threshold = 3
bars_fallback = false
bars_priority = 40
read_only = true
trust_tier = "T1_BEST_EFFORT"
allow_live_decision = false
allow_model_training = false
allow_public_redistribution = false
