# Render 部署清单（免费层 web 服务）
# 部署方式：将本仓库连到 Render 的 Blueprint，自动据此创建服务。
# 注意：本系统实时行情依赖中国大陆接口（腾讯/东财/新浪），
#       建议选 ap-southeast（Singapore）以尽量靠近大陆、提升真实数据可达性。
services:
  - type: web
    name: stock-tracker
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    # 区域：新加坡（离中国大陆最近，提升行情接口可达性）
    region: singapore
    # 健康检查：返回 200 即视为就绪
    healthCheckPath: /api/provider_health
    # Render 会注入 PORT 环境变量；应用读取之并绑定 0.0.0.0
    envVars:
      - key: PORT
        value: "8080"
      - key: PYTHONUNBUFFERED
        value: "1"
# 免费层 web 服务在空闲约 15 分钟后会休眠；首次请求触发冷启动（约数秒），
# 休眠期间实时采集会暂停，属已知限制。
